# Nouvelles en Français pour le Groupe Korol
# Format: Liste YAML, articles les plus récents en premier
# Chaque entrée sera affichée sur la page de nouvelles

- date: "2026-05-04"
  year: 2026
  title: "Trois nouveaux membres se joignent à l'équipe pour l'été 2026"
  content: |
    Nous sommes ravis d'accueillir Léopaul Charrier, Félix Archambault et Olivier Lebreux dans l'équipe pour la session d'été. Léopaul est étudiant en maîtrise de cours, tandis que Félix et Olivier sont étudiants de premier cycle à l'Université de Sherbrooke qui se joignent à nous en tant que stagiaires.

- date: "2026-04-09"
  year: 2026
  title: "Félix Archambault obtient une bourse CRSNG"
  content: |
    Félicitations à Félix Archambault pour avoir obtenu la Bourse CRSNG - 1er cycle - pour son stage d'été 2026 !

- date: "2026-03-02"
  year: 2026
  title: "Dmytro Skorubskyi se joint à l'équipe"
  content: |
    Dmytro Skorubskyi se joint à l'équipe pour une visite de recherche de 6 mois. Dmytro étudiera les équilibres isotopiques dans l'eau liquide en utilisant des méthodes de structure électronique de pointe couplées à des techniques d'intégrales de chemin.

- date: "2026-01-05"
  year: 2026
  title: "Jade Formel se joint à l'équipe"
  content: |
    Jade Formel se joint à l'équipe pour un projet de maîtrise d'une session dans le cadre de son programme de maîtrise en sciences des matériaux. Jade appliquera l'apprentissage automatique pour analyser et classifier les noirs de carbone avec [Adelphine Bonneau](https://www.usherbrooke.ca/chimie/departement/personnel/corps-professoral/professeurs/adelphine-bonneau).

- date: "2026-01-05"
  year: 2026
  title: "Création du Groupe Korol à l'Université de Sherbrooke"
  images:
    - file: "Sherbrooke_snow.jpg"
      path: "/images/news/"
      alt: "Campus de l'Université de Sherbrooke couvert de neige"
      title: "Université de Sherbrooke en hiver"
      featured: true
  content: |
    Le Groupe Korol débute officiellement ses opérations à l'Université de Sherbrooke,
    Département de chimie. Nous sommes ravis de commencer ce nouveau chapitre et
    nous avons hâte de bâtir un programme de recherche dynamique en dynamique quantique
    et en chimie théorique.

- date: "2025-11-05"
  year: 2025
  title: "Succès du financement MITACS GRA"
  content: |
    Félicitations à Dmytro Skorubskyi pour avoir obtenu le financement MITACS GRA pour un échange de 24 semaines. Nous sommes ravis de vous accueillir au sein du Groupe Korol au début de 2026 !

