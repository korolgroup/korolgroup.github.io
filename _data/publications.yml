  editors_pick: true
  alt_text:
    en: IR spectrum of liquid water computed with the new BCOCB scheme at timesteps of 0.2, 1.0, 1.2 and 1.4 fs
    fr: Spectre IR de l'eau liquide calculé avec le nouveau schéma BCOCB aux pas de temps de 0.2, 1.0, 1.2 et 1.4 fs
  summary:
    en: We further improve upon the standard algorithm for T-RPMD via a novel implementation of the Cayley modification [R Korol et al., J. Chem. Phys. 151, 124103 (2019)]. This allows for a substantial increase in timestep size - three-fold for the simulations of liquid water - at no extra cost.
    fr: Nous améliorons davantage l'algorithme standard pour T-RPMD via une implémentation nouvelle de la modification de Cayley [R Korol et al., J. Chem. Phys. 151, 124103 (2019)]. Cela permet une augmentation substantielle de la taille du pas de temps - trois fois pour les simulations d'eau liquide - sans coût supplémentaire.
- id: 7
