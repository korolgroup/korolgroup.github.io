- id: 13
  doi: 10.1103/5ywx-7dbs
  title: Robust Purely Optical Signatures of Floquet States in Laser-Dressed Crystals
  authors:
  - family: Tiwari
    given: V
  - family: Korol
    given: R
  - family: Franco
    given: I
    corresponding: true
  journal:
    full: Physical Review Letters
    abbrev: Phys. Rev. Lett.
  year: 2025
  volume: '135'
  issue: '18'
  pages: '186901'
  image: 13.jpg
  highlight: false
  alt_text:
    en: Figure showing optical signatures of Floquet states in laser-dressed crystals
    fr: Figure montrant les signatures optiques des états de Floquet dans les cristaux habillés par laser
  summary:
    en: We outline a simple way to detect elusive light-induced states in optically driven materials by analyzing how they absorb light. These so-called Floquet states, which form when materials interact with strong laser fields, are key to controlling material properties on demand—but until now, they've been extremely difficult to observe. We show that Floquet states leave clear, detectable signatures in the optical absorption spectrum, including new absorption peaks in regions where the material is normally transparent.
    fr: Nous décrivons une méthode simple pour détecter les états insaisissables induits par la lumière dans les matériaux optiquement excités en analysant comment ils absorbent la lumière. Ces états dits de Floquet, qui se forment lorsque les matériaux interagissent avec des champs laser intenses, sont essentiels pour contrôler les propriétés des matériaux à la demande—mais jusqu'à présent, ils ont été extrêmement difficiles à observer. Nous montrons que les états de Floquet laissent des signatures claires et détectables dans le spectre d'absorption optique, y compris de nouveaux pics d'absorption dans des régions où le matériau est normalement transparent.
- id: 12
  doi: 10.1021/acs.jpca.5c00943
  title: High-Frequency Tails in Spectral Densities
  authors:
  - family: Korol
    given: R
    corresponding: true
  - family: Chen
    given: X
  - family: Franco
    given: I
    corresponding: true
  journal:
    full: Journal of Physical Chemistry A
    abbrev: J. Phys. Chem. A
  year: 2025
  volume: '129'
  issue: '15'
  pages: 3587-3596
  image: 12.jpg
  alt_text:
    en: Figure showing spectral density high-frequency tails
    fr: Figure montrant les queues haute fréquence de la densité spectrale
  summary:
    en: We show that the computations of relaxation rate in solution are highly sensitive to the choice of representation of the environmental spectral density (SD). The key reason is that electronic relaxation is dominated by the resonant contribution from the high-frequency tails of the SD, which can vary significantly between strategies. We provide a simple transformation that recovers the correct relaxation rates in quantum simulations constrained by algorithmic or physical limitations on the shape of the SD.
    fr: Nous montrons que les calculs du taux de relaxation en solution sont très sensibles au choix de représentation de la densité spectrale environnementale (DS). La raison principale est que la relaxation électronique est dominée par la contribution résonante des queues haute fréquence de la DS, qui peuvent varier considérablement entre les stratégies. Nous fournissons une transformation simple qui récupère les taux de relaxation corrects dans les simulations quantiques contraintes par des limitations algorithmiques ou physiques sur la forme de la DS.
- id: 11
  doi: 10.1016/j.gca.2025.02.033
  title: 'Stable isotope equilibria in the dihydrogen-water-methane-ethane-propane system. Part 2: Experimental determination of hydrogen isotopic equilibrium for ethane-H2 from 30 to 200 °C and propane-H2 from 75 to 200 °C'
  authors:
  - family: Turner
    given: A C
    corresponding: true
  - family: Korol
    given: R
  - family: Bill
    given: M
  - family: Stolper
    given: D A
  journal:
    full: Geochimica et Cosmochimica Acta
    abbrev: Geochim. Cosmochim. Acta
  year: 2025
  volume: '396'
  pages: 91-106
  image: 11.jpg
  alt_text:
    en: Figure showing experimental determination of hydrogen isotopic equilibrium
    fr: Figure montrant la détermination expérimentale de l'équilibre isotopique de l'hydrogène
  summary:
    en: We compare experimental hydrogen isotopic equilibrium with high-level theoretical calculations and provide a preferred polynomial fit. Comparison of these fractionation factors with a compilation of ~500 compiled environmental gas samples supports the proposal that many (~50%) of these natural gas samples exhibit hydrogen isotopic compositions consistent with having formed in or attained methane-ethane-propane hydrogen isotopic equilibrium over geologically relevant temperatures for formation and storage (50-300°C).
    fr: Nous comparons l'équilibre isotopique expérimental de l'hydrogène avec des calculs théoriques de haut niveau et fournissons un ajustement polynomial préféré. La comparaison de ces facteurs de fractionnement avec une compilation d'environ 500 échantillons de gaz environnementaux soutient la proposition selon laquelle de nombreux (environ 50%) de ces échantillons de gaz naturel présentent des compositions isotopiques de l'hydrogène cohérentes avec une formation ou l'atteinte d'un équilibre isotopique de l'hydrogène méthane-éthane-propane à des températures géologiquement pertinentes pour la formation et le stockage (50–300°C).
- id: 10
  doi: 10.1016/j.gca.2025.02.028
  title: 'Stable isotope equilibria in the dihydrogen-water-methane-ethane-propane system. Part 1: Path-integral calculations with CCSD(T) quality potentials'
  authors:
  - family: Korol
    given: R
    corresponding: true
  - family: Turner
