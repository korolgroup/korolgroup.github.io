  volume: '3'
  issue: '12'
  pages: 2747-2764
  image: 7.jpg
  editors_choice: true
  alt_text:
    en: One-to-one theory-experiment agreement for the equilibrium clumping of deuterium with deuterium and deuterium with carbon-13 over temperatures between 1 and 500 degree Celsius
    fr: Accord théorie-expérience un pour un pour l'agrégation à l'équilibre du deutérium avec le deutérium et du deutérium avec le carbone-13 sur des températures entre 1 et 500 degrés Celsius
  summary:
    en: We study equilibrium clumping of heavy isotopes in methane. Using heavy isotope clumping, one can determine the temperature of methane when it was formed. We have extended the range of temperatures to cover all biologically and geologically relevant temperatures. Experimental clumping-temperature calibration is confirmed by state-of-the-art theoretical method - PIMC.
    fr: Nous étudions le regroupement à l'équilibre des isotopes lourds dans le méthane. En utilisant le regroupement d'isotopes lourds, on peut déterminer la température du méthane au moment de sa formation. Nous avons étendu la gamme de températures pour couvrir toutes les températures biologiquement et géologiquement pertinentes. La calibration expérimentale regroupement-température est confirmée par la méthode théorique de pointe - PIMC.
- id: 6
  doi: 10.1063/1.5120282
  title: Cayley modification for strongly stable path-integral and ring-polymer molecular dynamics
  authors:
  - family: Korol
    given: R
  - family: Bou-Rabee
    given: N
  - family: Miller
    given: T F
    corresponding: true
  journal:
    full: The Journal of Chemical Physics
    abbrev: J. Chem. Phys.
  year: 2019
  volume: '151'
  issue: '12'
  pages: '124103'
  image: 6.jpg
  editors_pick: true
  alt_text:
    en: Plot of energy drift for the Cayley modified scheme vs standard scheme at various timesteps
    fr: Tracé de la dérive d'énergie pour le schéma modifié de Cayley vs schéma standard à différents pas de temps
  summary:
    en: We present a novel implementation of the Cayley modification that ensures exact trajectories with respect to a modified Hamiltonian when the free ring-polymer limit is employed. This leads to strongly stable dynamics that enables considerably larger timesteps relative to existing approaches with other thermostatting methods or bare velocity Verlet integrators.
    fr: Nous montrons que l'algorithme standard pour faire évoluer les trajectoires PIMD conduit à des artefacts numériques à certains pas de temps (de résonance). Nous proposons donc la modification de Cayley, qui fournit une forte stabilité symplectique à PIMD, RPMD et CMD et l'ergodicité pour T-RPMD sans coût supplémentaire. Cela permet l'utilisation de pas de temps plus grands dans ces simulations.
- id: 5
  doi: 10.1021/acs.jpcb.8b12557
  title: Machine Learning Prediction of DNA Charge Transport
  authors:
  - family: Korol
    given: R
  - family: Segal
    given: D
    corresponding: true
  journal:
    full: Journal of Physical Chemistry B
    abbrev: J. Phys. Chem. B
  year: 2019
  volume: '123'
  issue: '13'
  pages: 2801-2811
  image: 5.jpg
  alt_text:
    en: Learning curve showing decrease in prediction error with training set size
    fr: Courbe d'apprentissage montrant la diminution de l'erreur de prédiction avec la taille de l'ensemble d'entraînement
  summary:
    en: We present a machine learning model that enables low-cost prediction of the electrical conductance of millions of long double-stranded DNA (dsDNA) sequences, reducing computational costs by several orders of magnitude. The algorithm is trained on short DNA nanojunctions with n = 3-7 base pairs.
    fr: Nous présentons un modèle d'apprentissage automatique qui permet la prédiction peu coûteuse de la conductance électrique de millions de longues séquences d'ADN double brin (ADNdb), réduisant les coûts computationnels de plusieurs ordres de grandeur. L'algorithme est entraîné sur de courtes nano-jonctions d'ADN avec n = 3-7 paires de bases.
- id: 4
  doi: 10.1021/acs.jpcc.7b12744
  title: From Exhaustive Simulations to Key Principles in DNA Nanoelectronics
  authors:
  - family: Korol
    given: R
  - family: Segal
    given: D
    corresponding: true
  journal:
    full: Journal of Physical Chemistry C
    abbrev: J. Phys. Chem. C
  year: 2018
  volume: '122'
  issue: '8'
  pages: 4206-4216
  image: 4.jpg
  alt_text:
    en: Log-log plot of conductance as environmental (thermal) effects are increased ten-fold from the dry and frozen to the wet and mobile environment. The lowest conductance values are boosted by a factor of 100, signifying hopping conductance. Best conductors are unaffected by the change. The vast majority of sequences fall somewhere in between.
    fr: Tracé log-log de la conductance lorsque les effets environnementaux (thermiques) sont augmentés d'un facteur dix de l'environnement sec et gelé à l'environnement humide et mobile. Les valeurs de conductance les plus faibles sont augmentées d'un facteur 100, signifiant une conductance par saut. Les meilleurs conducteurs ne sont pas affectés par le changement. La grande majorité des séquences se situe quelque part entre les deux.
  summary:
    en: Conductance of DNA molecules is not well-understood in the light of opposing experimental results. The situation is also complicated, because there are exponentially many different sequences, and many of them conduct current in a drastically different way. Here we study the conductance of DNA molecules computationally and identify several general principles that could guide the experiments.
    fr: La conductance des molécules d'ADN n'est pas bien comprise à la lumière des résultats expérimentaux contradictoires. La situation est également compliquée, car il existe exponentiellement beaucoup de séquences différentes, et beaucoup d'entre elles conduisent le courant de manière radicalement différente. Ici, nous étudions la conductance des molécules d'ADN de manière computationnelle et identifions plusieurs principes généraux qui pourraient guider les expériences.
- id: 3
  doi: 10.1016/j.cpc.2017.10.005
  title: 'ProbeZT: Simulation of transport coefficients of molecular electronic junctions under environmental effects using Büttiker''s probes'
  authors:
  - family: Korol
    given: R
  - family: Kilgour
    given: M
  - family: Segal
    given: D
    corresponding: true
  journal:
    full: Computer Physics Communications
    abbrev: Comput. Phys. Commun.
  year: 2018
  volume: '224'
  pages: 396-404
  image: 3.jpg
  alt_text:
    en: Conductance of a uniform bridge between 2 and 10 sites long. The log-y scale reveals the hopping (linear), tunneling (exponential) and ballistic (constant) conduction mechanisms at different environmental strengths.
    fr: Conductance d'un pont uniforme entre 2 et 10 sites de longueur. L'échelle log-y révèle les mécanismes de conduction par saut (linéaire), tunneling (exponentiel) et balistique (constant) à différentes forces environnementales.
  summary:
    en: 'Our in-house quantum transport package, ProbeZT, calculates how readily electricity and heat moves across a given system. One can use it to identify molecules that are: good conductors, perfect insulators, excellent thermoelectrics and many more. In particular, we show the package applied to a linear conducting chain (like a polymer) and to a double-stranded DNA molecule.'
    fr: 'Notre logiciel de transport quantique interne, ProbeZT, calcule avec quelle facilité l''électricité et la chaleur se déplacent à travers un système donné. On peut l''utiliser pour identifier des molécules qui sont : de bons conducteurs, des isolants parfaits, d''excellents thermoélectriques et bien plus encore. En particulier, nous montrons le logiciel appliqué à une chaîne conductrice linéaire (comme un polymère) et à une molécule d''ADN double brin.'
- id: 2
  doi: 10.1063/1.4971167
  title: 'Thermopower of molecular junctions: Tunneling to hopping crossover in DNA'
  authors:
  - family: Korol
    given: R
  - family: Kilgour
    given: M
  - family: Segal
    given: D
    corresponding: true
  journal:
    full: The Journal of Chemical Physics
    abbrev: J. Chem. Phys.
  year: 2016
  volume: '145'
  issue: '22'
  pages: '224702'
  image: 2.jpg
  alt_text:
    en: A schematic diagram of Landauer-Buttiker approach to thermally-assisted transport across a uniform bridge, where the effects of environment are modelled using voltage-temperature probes.
    fr: Schéma de l'approche de Landauer-Buttiker pour le transport thermiquement assisté à travers un pont uniforme, où les effets de l'environnement sont modélisés à l'aide de sondes de tension-température.
  summary:
    en: We examine the DNA molecules, that show a change in behavior in conductance and thermopower beyond a certain length, studied experimentally in Li et al. [Nat. Commun. 7, 11294 (2016)]. We show that the change in thermoelectric trends is caused by a change of the mechanism, by which a molecule conducts current from quantum mechanical tunneling to classical hopping.
    fr: Nous examinons les molécules d'ADN, qui montrent un changement de comportement dans la conductance et le pouvoir thermoélectrique au-delà d'une certaine longueur, étudiées expérimentalement dans Li et al. Nous montrons que le changement dans les tendances thermoélectriques est causé par un changement du mécanisme par lequel une molécule conduit le courant, passant de l'effet tunnel quantique au saut classique.
