- date: "2025-11-05"
  year: 2025
  title: "MITACS GRA Funding Success"
  content: |
    Congratulations to Dmytro Skorubskyi for securing the MITACS GRA funding for a 24-week exchange. We are excited to welcome you to Korol group in early 2026!

