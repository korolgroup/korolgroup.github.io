# English News Items for Korol Group
# Format: YAML list, newest items first
# Each entry will be displayed on the news page

- date: "2026-05-14"
  year: 2026
  title: "Roman Korol joins Institut Quantique"
  content: |
    Roman Korol has become a member of the [Institut Quantique (Quantum Institute)](https://www.usherbrooke.ca/iq/en/) at Université de Sherbrooke, a leading research center for quantum information science and quantum technologies in Canada.

- date: "2026-05-04"
  year: 2026
  title: "Three new members join the team for summer 2026"
  content: |
    We are excited to welcome Léopaul Charrier, Félix Archambault, and Olivier Lebreux to the team for the summer term. Léopaul is a course-based MSc student, while Félix and Olivier are undergraduate students at the Université de Sherbrooke joining as interns.

- date: "2026-04-09"
  year: 2026
  title: "Félix Archambault awarded NSERC USRA"
  content: |
    Congratulations to Félix Archambault for securing the NSERC Undergraduate Student Research Award (USRA) for his summer 2026 internship!

- date: "2026-03-02"
  year: 2026
  title: "Dmytro Skorubskyi joins the team"
  content: |
    Dmytro Skorubskyi joins the team for a 6-month research visit. Dmytro will study isotopic equilibria in liquid water using state-of-the-art electronic structure methods coupled with Path-integral techniques.

- date: "2026-01-05"
  year: 2026
  title: "Jade Formel joins the team"
  content: |
    Jade Formel joins the team for a 1-term Masters project as part of her Masters in Material Science degree. Jade will be applying Machine Learning to analyze and classify Carbon blacks with [Adelphine Bonneau](https://www.usherbrooke.ca/chimie/departement/personnel/corps-professoral/professeurs/adelphine-bonneau).

- date: "2026-01-05"
  year: 2026
  title: "Group established at Sherbrooke University"
