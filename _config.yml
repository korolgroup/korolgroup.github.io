# Jekyll configuration for Korol Group website
title: Korol Group
description: "The Korol Group at Sherbrooke University develops theoretical frameworks for quantum systems, focusing on quantum statistics, chemical reaction rates, and open quantum dynamics."
url: "https://qckorol.ca"
baseurl: ""

# Build settings
markdown: kramdown
permalink: pretty

# Exclude files from processing
exclude:
  - node_modules/
  - make_pdf/
  - content/
  - .claude/
  - README.md
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .git/
  - .gitignore
  - "*.bat"
  - scripts/
  - pdf/*.tex
  - pdf/*.log
  - pdf/*.docx
  - pdf/*.cls
  - pdf/*.synctex.gz
  - pdf/*.aux
  - pdf/*.out
  - pdf/*.fdb_latexmk
  - pdf/*.fls

# Include PDF directory for serving
include:
  - pdf

# Default front matter
# Language is set in each page's front matter
